<html lang="ru">
<head>
<meta charset="utf-8">

<style>
:root{
  --ink:#3A2F33;
  --ink-soft:#948288;
  --porcelain:#FFFBF8;
  --card:#FFFFFF;
  --line:#F4E6E2;
  --wine:#EE7D9C;
  --wine-deep:#E0678A;
  --gold:#D9A94E;
  --gold-soft:#FBE9C4;

  --r-m:16px;
  --r-l:26px;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--porcelain);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:radial-gradient(88% 44% at 10% 0%, #FFEFF4 0%, rgba(255,239,244,0) 60%),
             radial-gradient(84% 42% at 94% 4%, #FFF6E2 0%, rgba(255,246,226,0) 58%),
             var(--porcelain);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F9F2EF; --ink-soft:#C2B0B5; --porcelain:#211A1C; --card:#2E2427;
    --line:#45363B; --wine:#F792AC; --wine-deep:#EE7D9C; --gold:#EFC475; --gold-soft:#59432C;
  }
  :root:not([data-theme="light"]) body{
    background:radial-gradient(110% 55% at 50% 0%, #30242A 0%, rgba(48,36,42,0) 60%), var(--porcelain);
  }
}
:root[data-theme="dark"]{
  --ink:#F9F2EF; --ink-soft:#C2B0B5; --porcelain:#211A1C; --card:#2E2427;
  --line:#45363B; --wine:#F792AC; --wine-deep:#EE7D9C; --gold:#EFC475; --gold-soft:#59432C;
}

[hidden]{display:none !important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

.shell{max-width:470px;margin:0 auto;padding:0 20px 52px}

/* ---------- header ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  padding:22px 0 12px;
  background:linear-gradient(to bottom,var(--porcelain) 70%,rgba(255,251,248,0));
}
.top-row{display:flex;align-items:center;gap:10px;padding:0 14px}
.mark{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:18px;letter-spacing:.2em;font-weight:500;text-transform:uppercase;white-space:nowrap;
}
.mark span{color:var(--gold)}
.counter{margin-left:auto;font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;white-space:nowrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:0 0 auto}
.lang button{
  border:0;background:transparent;cursor:pointer;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;
  padding:5px 8px;color:var(--ink-soft);transition:background .15s,color .15s;
}
.lang button.is-on{background:var(--wine);color:#FFFFFF}
.bar{height:2px;background:var(--line);margin:14px 14px 0;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .45s cubic-bezier(.22,.9,.3,1)}
@media (max-width:359px){ .mark{font-size:15px;letter-spacing:.14em} .counter{font-size:10.5px} }

/* ---------- screens ---------- */
.screen{display:none;padding:14px 14px 0}
.screen.is-on{display:block}

h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;letter-spacing:-.01em;margin:0}
h1{font-size:38px;line-height:1.08}
h2{font-size:27px;line-height:1.18}
p{margin:10px 0 0;color:var(--ink-soft);font-size:15px}

.hero{padding:22px 0 0}
.hero .eyebrow{
  font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--gold);
  letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;
}
.hero h1 em{font-style:italic;color:var(--wine)}
.facts{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--line)}
.facts li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.facts li b{font-weight:600;min-width:92px;flex:0 0 auto;color:var(--ink)}
.facts li span{color:var(--ink-soft)}

/* options */
.qhint{font-size:14px;color:var(--ink-soft);margin-top:8px}
.opts{margin:22px 0 0;display:grid;gap:9px}
.opt{
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-m);padding:15px 16px;display:flex;align-items:center;gap:13px;
  cursor:pointer;transition:border-color .15s,transform .08s,background .15s;
}
.opt:active{transform:scale(.988)}
.opt .dot{width:9px;height:9px;border-radius:50%;background:var(--gold-soft);flex:none;box-shadow:0 0 0 4px rgba(217,169,78,.16)}
.opt .box{
  width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;transition:border-color .15s,background .15s;
}
.opt .box svg{width:11px;height:11px;stroke:#FFFFFF;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.opt.sel .box{border-color:var(--wine);background:var(--wine)}
.opt.sel .box svg{opacity:1}
.opt .body{min-width:0;flex:1 1 auto}
.opt .t{display:block;font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.opt .s{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}
.opt .s:empty{display:none}
.opt .p{flex:0 0 auto;font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--ink-soft);white-space:nowrap}
.opt.sel{border-color:var(--wine);background:linear-gradient(0deg,rgba(238,125,156,.08),rgba(238,125,156,.08)),var(--card)}
.opt.sel .dot{background:var(--wine)}
.opt.sel .p{color:var(--ink)}

.teaser{
  margin-top:18px;display:flex;gap:10px;align-items:flex-start;
  border:1px dashed var(--gold);border-radius:var(--r-m);
  padding:12px 14px;font-size:13.5px;color:var(--ink-soft);background:rgba(217,169,78,.12);
}
.teaser b{color:var(--ink);font-weight:600}

/* buttons */
.btn{
  display:block;width:100%;border:0;border-radius:999px;padding:17px 20px;
  font-size:16px;font-weight:600;cursor:pointer;transition:transform .08s,opacity .15s;
  text-align:center;text-decoration:none;
}
.btn:active{transform:scale(.99)}
.btn-primary{background:linear-gradient(135deg,var(--wine),var(--wine-deep));color:#FFFFFF;box-shadow:0 8px 22px rgba(238,125,156,.30)}
.btn-primary:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn-back{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-weight:500;font-size:14.5px;padding:13px 20px}
.actions{margin-top:24px;display:grid;gap:9px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 20px;margin-top:20px;box-shadow:0 8px 24px rgba(214,160,175,.09)}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;margin:0;line-height:1.2}
.rows{margin:16px 0 0}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.row span{color:var(--ink-soft);flex:1 1 auto}
.row b{font-weight:600;text-align:right;flex:0 0 auto;white-space:nowrap}
.row.total{border-top:1px solid var(--ink);margin-top:2px}
.row.total span{color:var(--ink);font-weight:600}
.row.total b{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:500}
.row.save b{color:var(--wine)}
.why{margin-top:16px;font-size:14px;color:var(--ink-soft);border-left:2px solid var(--gold);padding-left:12px}

/* ---------- calendar ---------- */
.cal{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 14px;box-shadow:0 8px 24px rgba(214,160,175,.09)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 10px}
.cal-title{font-family:'Cormorant Garamond',serif;font-size:21px}
.cal-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-nav svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow b{font-size:11px;font-weight:500;color:var(--ink-soft);text-align:center;padding:4px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{
  aspect-ratio:1;border:0;background:transparent;border-radius:12px;
  font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer;
  display:grid;place-items:center;position:relative;transition:background .15s,color .15s;
}
.day.off{color:var(--ink-soft);opacity:.28;cursor:default}
.day.today::after{content:'';position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.day.sel{background:var(--wine);color:#FFFFFF;font-weight:700}
.day.sel::after{background:#FFFFFF}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:14px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 6px;font-size:14.5px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s,transform .08s}
.slot:active{transform:scale(.97)}
.slot.sel{border-color:var(--wine);background:var(--wine);color:#FFFFFF}
.slots-title{margin-top:20px;font-size:13px;color:var(--ink-soft)}

/* ---------- masters ---------- */
.masters{margin-top:20px;display:grid;gap:11px}
.tier{
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:17px 18px 17px 46px;cursor:pointer;display:block;position:relative;
  transition:border-color .18s,box-shadow .18s,transform .08s;
}
.tier:active{transform:scale(.99)}
.tier-mark{
  position:absolute;left:17px;top:19px;width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--line);display:grid;place-items:center;transition:border-color .18s,background .18s;
}
.tier-mark::after{content:'';width:8px;height:8px;border-radius:50%;background:transparent;transition:background .18s}
.tier.sel{border-color:var(--wine);box-shadow:0 10px 28px rgba(238,125,156,.22)}
.tier.sel .tier-mark{border-color:var(--wine);background:rgba(238,125,156,.16)}
.tier.sel .tier-mark::after{background:var(--wine)}
.tier-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tier-name{font-weight:700;font-size:16px;letter-spacing:-.01em}
.tier-tag{
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--wine);
  border:1px solid var(--gold-soft);background:rgba(217,169,78,.20);border-radius:999px;padding:3px 9px;
}
.tier-price{display:block;font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1.2;margin-top:4px}
.tier-list{list-style:none;margin:11px 0 0;padding:0;display:grid;gap:6px}
.tier-list li{position:relative;padding-left:16px;font-size:13.5px;color:var(--ink-soft);line-height:1.4}
.tier-list li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold-soft)}
.tier.sel .tier-list li::before{background:var(--wine)}

/* ---------- wheel ---------- */
.wheel-wrap{position:relative;width:min(92vw,352px);margin:26px auto 0;aspect-ratio:1}
.wheel-wrap svg{display:block;width:100%;height:100%;filter:drop-shadow(0 14px 32px rgba(238,125,156,.24))}
#wheelRot{transform-origin:170px 170px}
.pin{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--wine-deep);z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:58px;height:58px;border-radius:50%;background:var(--card);border:1px solid var(--gold);
  display:grid;place-items:center;z-index:2;
  font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;
}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(90,60,70,.34);backdrop-filter:blur(5px);padding-top:env(safe-area-inset-top,0px)}
.modal.is-on{display:flex}
.sheet{background:var(--card);width:100%;max-width:470px;border-radius:var(--r-l) var(--r-l) 0 0;padding:26px 28px calc(26px + env(safe-area-inset-bottom,0px));animation:rise .3s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.prize{font-family:'Cormorant Garamond',serif;font-size:40px;line-height:1.05;color:var(--wine);margin:6px 0 2px}

/* ---------- form ---------- */
label{display:block;margin-top:14px;font-size:13px;color:var(--ink-soft)}
input{width:100%;margin-top:6px;padding:14px 15px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--porcelain);color:var(--ink);font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--gold);background:var(--card)}
.phone{position:relative;margin-top:6px}
.phone-cc{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  font-size:16px;font-weight:600;color:var(--ink);pointer-events:none;
  padding-right:10px;border-right:1px solid var(--line);
}
.phone input{margin-top:0;padding-left:76px;letter-spacing:.02em}
.err{color:var(--wine);font-size:12.5px;margin-top:8px;display:none}
.err.is-on{display:block}
.fineprint{font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.45}

.promo{margin-top:18px;border:1px dashed var(--gold);border-radius:var(--r-m);padding:16px;text-align:center;background:rgba(217,169,78,.13)}
.promo .code{font-family:'Cormorant Garamond',serif;font-size:30px;letter-spacing:.1em;color:var(--wine)}
.promo small{display:block;font-size:12px;color:var(--ink-soft);margin-top:4px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft)}

.conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf i{position:absolute;width:7px;height:11px;border-radius:1px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg);opacity:.15}}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.08s !important}}
@media (min-width:520px){h1{font-size:44px}}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="top-row">
      <div class="mark">Za<span>_</span>manic</div>
      <div class="counter" id="counter"></div>
      <div class="lang" id="lang">
        <button type="button" data-lang="ru" class="is-on">RU</button>
        <button type="button" data-lang="uz">UZ</button>
      </div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </header>

  <!-- INTRO -->
  <section class="screen is-on" id="s-intro">
    <div class="hero">
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="heroTitle"></h1>
      <p data-t="heroText"></p>
      <ul class="facts">
        <li><b data-t="f1k"></b><span data-t="f1v"></span></li>
        <li><b data-t="f2k"></b><span data-t="f2v"></span></li>
        <li><b data-t="f3k"></b><span data-t="f3v"></span></li>
      </ul>
      <div class="teaser">🎡 <span data-t="teaser"></span></div>
      <div class="actions"><button class="btn btn-primary" id="start" data-t="startBtn"></button></div>
    </div>
  </section>

  <!-- QUESTIONS -->
  <section class="screen" id="s-q">
    <h2 id="qTitle"></h2>
    <p class="qhint" id="qHint"></p>
    <div class="opts" id="qOpts"></div>
    <div class="err" id="qErr" data-t="pickOne"></div>
    <div class="teaser" id="qTeaser" hidden>🎡 <span data-t="teaser"></span></div>
    <div class="actions" id="qActions">
      <button class="btn btn-primary" id="qNext" hidden data-t="nextBtn"></button>
      <button class="btn btn-back js-back" data-t="back"></button>
    </div>
  </section>

  <!-- RESULT + MASTERS -->
  <section class="screen" id="s-result">
    <h2 data-t="resultTitle"></h2>
    <div class="card">
      <h3 id="rTitle"></h3>
      <div class="rows" id="rRows"></div>
      <div class="why" id="rWhy"></div>
    </div>
    <div id="masterBlock">
      <h2 style="margin-top:30px" data-t="masterTitle"></h2>
      <p data-t="masterText"></p>
      <div class="masters" id="tiers"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="toDate" disabled data-t="nextBtn"></button>
      <button class="btn btn-back js-back" data-t="back"></button>
    </div>
  </section>

  <!-- DATE & TIME -->
  <section class="screen" id="s-date">
    <h2 data-t="dateTitle"></h2>
    <p data-t="dateText"></p>
    <div class="cal">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" aria-label="←"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-nav" id="calNext" aria-label="→"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="dow" id="dowRow"></div>
      <div class="days" id="calDays"></div>
      <div class="slots-title" id="slotsTitle"></div>
      <div class="slots" id="slots"></div>
    </div>
    <div class="actions"><button class="btn btn-back js-back" data-t="back"></button></div>
  </section>

  <!-- WHEEL -->
  <section class="screen" id="s-wheel">
    <h2 data-t="wheelTitle"></h2>
    <p data-t="wheelText"></p>
    <div class="wheel-wrap">
      <div class="pin"></div>
      <div class="hub">Za</div>
      <svg viewBox="0 0 340 340" aria-hidden="true"><g id="wheelRot"></g></svg>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="spin" data-t="spinBtn"></button>
      <button class="btn btn-back js-back" data-t="back"></button>
    </div>
  </section>

  <!-- FORM -->
  <section class="screen" id="s-form">
    <h2 data-t="formTitle"></h2>
    <p data-t="formText"></p>

    <div class="card">
      <h3 data-t="yourBooking"></h3>
      <div class="rows" id="fRows"></div>
      <div class="why" id="fNote" hidden></div>
    </div>

    <div class="card" id="formCard" style="padding-top:18px">
      <label for="fName" data-t="lName"></label>
      <input id="fName" type="text" autocomplete="given-name" data-ph="phName">
      <label for="fPhone" data-t="lPhone"></label>
      <div class="phone">
        <span class="phone-cc">+998</span>
        <input id="fPhone" type="tel" inputmode="numeric" autocomplete="tel-national"
               maxlength="12" placeholder="90 123 45 67">
      </div>
      <label for="fTg" data-t="lTg"></label>
      <input id="fTg" type="text" autocomplete="off" placeholder="@username">
      <div class="err" id="fErr" data-t="errText"></div>
      <p class="fineprint" data-t="fineprint"></p>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="send" data-t="sendBtn"></button>
    </div>
  </section>

  <!-- DONE -->
  <section class="screen" id="s-done">
    <h2 id="doneTitle"></h2>
    <p data-t="doneText"></p>
    <div class="promo">
      <div class="code" id="dCode">ZM20</div>
      <small data-t="promoNote"></small>

/* ==========================================================================
   ЦЕНЫ — готовые итоги из прайса. [мастер, топ-мастер], в тысячах сум.
   ========================================================================== */
const K = 1000;
const NUDE_TOTAL = {
  base:{ none:[200,230], french:[250,300], rub:[230,270], cateye:[240,280], other:[210,240], stamp:[200,230] },
  gel: { none:[210,250], french:[260,320], rub:[240,290], cateye:[250,300], other:[220,260], stamp:[210,250] }
};
const EXT_TOTAL = {
  tips: { no:[300,350], yes:[350,420] },
  upper:{ no:[350,400], yes:[400,470] },
  fix:  { no:[200,230], yes:[250,300] }
};
const PEDI_TOTAL = {
  classic:{ no:[200,250], yes:[250,310] },
  combi:  { no:[230,280], yes:[280,340] },
  smart:  { no:[250,300], yes:[300,360] }
};
const H6_TOTAL = {
  clean:{ tint:[380,450], corr:[410,480], arch:[430,500], light:[530,600], lam:[530,600], full:[580,650] },
  nude: { tint:[500,600], corr:[530,630], arch:[550,650], light:[650,750], lam:[650,750], full:[700,800] }
};
const BROW_PRICE = { tint:50, corr:80, arch:100, light:200, lam:200, full:250 };
const STAMP_PER_NAIL = 10000;

function optLabel(qid, val){
  const q = QUESTIONS.find(x=>x.id===qid);
  const o = q && q.options.find(x=>x.v===val);
  return o ? o.t : P('','');
}
const lower = o => P(o.ru.toLowerCase(), o.uz.toLowerCase());

/* Итоговый расчёт по выбранной ветке */
function quote(){
  const a = A, lines = [];
  let m = 0, t = 0, approx = false, unknown = false, admin = null;
  const add = (label, mm, tt) => { lines.push({label, m:mm, t:tt}); m += mm; t += tt; };
  const pr = arr => [arr[0]*K, arr[1]*K];

  if(a.service === 'manicure'){
    const k = a.mani;
    if(k === 'bond'){
      /* бондирование 200/230; снятие добавляет +40/+50, как у чистого маникюра */
      if(a.cleanRemoval === 'yes') add(P('Бондирование ногтей со снятием','Tirnoq bondlash, olib tashlash bilan'), 240*K, 280*K);
      else add(P('Бондирование ногтей','Tirnoq bondlash'), 200*K, 230*K);
    }
    else if(k === 'clean'){
      if(a.cleanRemoval === 'yes') add(P('Чистый маникюр со снятием','Toza manikyur, olib tashlash bilan'), 170*K, 200*K);
      else add(P('Чистый маникюр','Toza manikyur'), 130*K, 150*K);
    }
    else if(k === 'japanese') add(P('Японский маникюр','Yapon manikyuri'), 200*K, 220*K);
    else if(k === 'henna')    add(P('Хна','Xina'), 200*K, 220*K);
    else if(k === 'nude'){
      const b = a.nudeBase || 'base', d = a.nudeDesign || 'none';
      const [mm,tt] = pr(NUDE_TOTAL[b][d]);
      const base = b === 'gel' ? P('Нюдовый маникюр гелем','Nyud manikyur (gel)')
                               : P('Нюдовый маникюр базой','Nyud manikyur (baza)');
      const dn = lower(optLabel('nudeDesign', d));
      const full = d === 'none' ? base : P(base.ru + ', ' + dn.ru, base.uz + ', ' + dn.uz);
      add(full, mm, tt);
      if(d === 'other') approx = true;
      if(d === 'stamp'){
        const n = parseInt(a.stampCount || '1', 10);
        add(P('Стемпинг · ' + n + ' ногт.', 'Stamping · ' + n + ' ta tirnoq'), STAMP_PER_NAIL*n, STAMP_PER_NAIL*n);
      }
    }
    else if(k === 'lacquer'){
      const v = a.lacType || 'normal';
      const [mm,tt] = pr(v === 'halal' ? [200,220] : [150,170]);
      const ln = lower(optLabel('lacType', v));
      add(P('Маникюр · ' + ln.ru, 'Manikyur · ' + ln.uz), mm, tt);
    }
    else if(k === 'ext'){
      const v = a.extType || 'tips', c = a.extCover || 'no';
      const [mm,tt] = pr(EXT_TOTAL[v][c]);
      const n = optLabel('extType', v);
      add(c === 'yes' ? P(n.ru + ' + гель-лак', n.uz + ' + gel-lak') : n, mm, tt);
    }
    else if(k === 'removal')       add(P('Снятие без покрытия','Qoplamasiz olib tashlash'), 40*K, 50*K);
    else if(k === 'removal_clean') add(P('Снятие + чистый маникюр','Olib tashlash + toza manikyur'), 170*K, 200*K);
    else if(k === 'help'){ unknown = true; admin = 'help'; add(P('Подбор процедуры на месте','Joyida xizmat tanlash'), 0, 0); }
  }

  else if(a.service === 'pedicure'){
    const v = a.pedi || 'classic', c = a.pediCover || 'no';
    const [mm,tt] = pr(PEDI_TOTAL[v][c]);
    const n = optLabel('pedi', v);
    add(c === 'yes' ? P(n.ru + ' с покрытием', n.uz + ' (qoplama bilan)') : n, mm, tt);
  }

  else if(a.service === 'hands4'){
    if(a.h4 === 'clean')     add(P('Чистый маникюр + чистый педикюр','Toza manikyur + toza pedikyur'), 330*K, 400*K);
    else if(a.h4 === 'nude') add(P('Нюдовый маникюр + классический педикюр с покрытием','Nyud manikyur + klassik pedikyur (qoplama bilan)'), 450*K, 550*K);
    else { unknown = true; admin = 'two'; }
  }

  else if(a.service === 'hands6'){
    if(a.h6 === 'clean' || a.h6 === 'nude'){
      const b = a.h6brows || 'tint';
      const [mm,tt] = pr(H6_TOTAL[a.h6][b]);
      const base = a.h6 === 'clean'
        ? P('Чистый маникюр + чистый педикюр','Toza manikyur + toza pedikyur')
        : P('Нюдовый маникюр + классический педикюр с покрытием','Nyud manikyur + klassik pedikyur (qoplama bilan)');
      const br = lower(optLabel('h6brows', b));
      add(P(base.ru + ' + ' + br.ru, base.uz + ' + ' + br.uz), mm, tt);
    }
    else { unknown = true; admin = 'three'; }
  }

  else if(a.service === 'brows'){
    const v = a.brow;
    if(v === 'help'){ unknown = true; admin = 'help'; add(P('Подбор процедуры на месте','Joyida xizmat tanlash'), 0, 0); }
    else if(v){ const p = BROW_PRICE[v] * K; add(optLabel('brow', v), p, p); }
  }

  return { lines, m, t, approx, unknown, admin };
}

const isCustomSet = () => (A.h4 === 'custom') || (A.h6 === 'custom');
const needsMaster = () => { const q = quote(); return !q.unknown && q.m !== q.t; };
const hasDateStep = () => !isCustomSet();

/* ========================== СОСТОЯНИЕ ========================== */
let qIndex = 0, tier = null, spinCount = 0, spinning = false, rotation = 0;
let calMonth, pickedDate = null, pickedSlot = null, current = 'intro';
let lastLead = null;

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ru-RU').replace(/,/g,' ') + (lang==='ru' ? ' сум' : ' soʻm');
const fmtFrom = n => lang==='ru' ? 'от ' + fmt(n) : fmt(n) + 'dan';
const activeQuestions = () => QUESTIONS.filter(q => !q.when || q.when(A));

function track(name, params, standard){
  try{ if(typeof fbq === 'function') fbq(standard ? 'track' : 'trackCustom', name, params || {}); }catch(e){}
}

/* ========================== ЯЗЫК ========================== */
function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v = L(T[el.dataset.t]);
    if(typeof v === 'string') el.innerHTML = v;
  });
  document.querySelectorAll('[data-ph]').forEach(el=>{ el.placeholder = L(T[el.dataset.ph]) || ''; });
  $('dowRow').innerHTML = DOW[lang].map(d=>'<b>'+d+'</b>').join('');
}

$('lang').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  $('lang').querySelectorAll('button').forEach(x=>x.classList.toggle('is-on', x.dataset.lang===lang));
  try{ localStorage.setItem('zm_lang', lang); }catch(err){}
  applyStatic();
  rerender();
});

function rerender(){
  if(current === 'q')           renderQuestion();
  else if(current === 'result') renderResult();
  else if(current === 'date'){  drawMonth(); setCounter('cDate'); }
  else if(current === 'wheel'){ redrawWheel(); setCounter('cWheel'); }
  else if(current === 'form')   renderForm(false);
  else if(current === 'done')   renderDone();
  else setCounter('cIntro');
}

const setCounter = key => $('counter').textContent = L(T[key]);

function show(name){
  current = name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('is-on'));
  $('s-'+name).classList.add('is-on');
  window.scrollTo({top:0,behavior:'auto'});
}
const progress = p => $('barFill').style.width = Math.max(0,Math.min(100,p)) + '%';

/* ========================== НАЗАД ========================== */
document.querySelectorAll('.js-back').forEach(b=>b.addEventListener('click', goBack));
function goBack(){
  if(current === 'q'){
    if(qIndex > 0){ qIndex--; renderQuestion(); }
    else { progress(6); setCounter('cIntro'); show('intro'); }
  }
  else if(current === 'result'){ qIndex = activeQuestions().length - 1; renderQuestion(); }
  else if(current === 'date'){ renderResult(); }
  else if(current === 'wheel'){
    if(hasDateStep()) renderDate();
    else { qIndex = activeQuestions().length - 1; renderQuestion(); }
  }
}

/* ========================== ВОПРОСЫ ========================== */
$('start').addEventListener('click', ()=>{ qIndex=0; renderQuestion(); });

function afterQuestions(){
  if(isCustomSet()){ redrawWheel(); setCounter('cWheel'); progress(80); show('wheel'); }
  else renderResult();
}

function clearDownstream(changedId){
  const order = QUESTIONS.map(q=>q.id);
  const from = order.indexOf(changedId);
  order.slice(from+1).forEach(id=>{ delete A[id]; });
  tier = null;
}

function renderQuestion(){
  const list = activeQuestions();
  if(qIndex >= list.length){ afterQuestions(); return; }
  const q = list[qIndex];

  $('qTitle').textContent = L(q.title);
  const hint = q.hint ? L(q.hint) : '';
  $('qHint').textContent = hint;
  $('qHint').hidden = !hint;
  $('qErr').classList.remove('is-on');

  if(q.multi && !Array.isArray(A[q.id])) A[q.id] = [];

  const box = $('qOpts');
  box.innerHTML = '';
  q.options.forEach(o=>{
    const b = document.createElement('button');
    b.type = 'button';
    const picked = q.multi ? A[q.id].includes(o.v) : A[q.id] === o.v;
    b.className = 'opt' + (picked ? ' sel' : '');
    const marker = q.multi
      ? '<span class="box"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>'
      : '<span class="dot"></span>';
    b.innerHTML = marker + '<span class="body"><span class="t"></span><span class="s"></span></span>'
                + (o.from ? '<span class="p"></span>' : '');
    b.querySelector('.t').textContent = L(o.t);
    b.querySelector('.s').textContent = o.s ? L(o.s) : '';
    if(o.from){
      const k = o.from/1000;
      b.querySelector('.p').textContent = lang==='ru' ? 'от '+k+'к' : k+'k dan';
    }
    b.addEventListener('click', ()=>{
      if(q.multi){
        const arr = A[q.id];
        const i = arr.indexOf(o.v);
        if(i >= 0) arr.splice(i,1); else arr.push(o.v);
        b.classList.toggle('sel');
        $('qErr').classList.remove('is-on');
      } else {
        const changed = A[q.id] !== o.v;
        A[q.id] = o.v;
        if(changed) { clearDownstream(q.id); A[q.id] = o.v; }
        box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        setTimeout(()=>{ qIndex++; renderQuestion(); }, 190);
      }
    });
    box.appendChild(b);
  });

  $('qNext').hidden = !q.multi;
  $('qTeaser').hidden = qIndex < 1;
  $('counter').textContent = lang==='ru'
    ? 'Вопрос ' + (qIndex+1) + ' из ' + list.length
    : 'Savol ' + (qIndex+1) + ' / ' + list.length;
  progress(8 + (qIndex/Math.max(list.length,1))*48);
  show('q');
}

$('qNext').addEventListener('click', ()=>{
  const q = activeQuestions()[qIndex];
  if(q && q.multi && (!A[q.id] || !A[q.id].length)){ $('qErr').classList.add('is-on'); return; }
  qIndex++; renderQuestion();
});

/* ========================== РЕЗУЛЬТАТ + МАСТЕР ========================== */
const row = (k,v,cls) => '<div class="row'+(cls?' '+cls:'')+'"><span>'+k+'</span><b>'+v+'</b></div>';

function headTitle(){
  const map = {
    manicure:P('Маникюр','Manikyur'), pedicure:P('Педикюр','Pedikyur'),
    hands4:P('В 4 руки','4 qoʻlda'), hands6:P('В 6 рук','6 qoʻlda'), brows:P('Брови','Qosh')
  };
  return L(map[A.service] || P('',''));
}

function customList(){
  const id = A.h4 === 'custom' ? 'h4custom' : 'h6custom';
  return (A[id] || []).map(v => L(optLabel(id, v))).join(', ');
}

function whyText(){
  if(A.service === 'hands6') return L(T.whyHands6);
  if(A.service === 'hands4') return L(T.whyHands4);
  if(A.mani === 'ext')       return L(T.whyExt);
  if(A.nudeDesign && A.nudeDesign !== 'none') return L(T.whyDesign);
  return L(T.whyDefault);
}

function quoteRows(tid, withDate){
  const q = quote();
  let html = '';
  if(q.unknown && q.admin !== 'help'){
    html += row(L(T.rServices), customList() || '—');
  } else {
    q.lines.forEach(l=>{
      const val = (l.m === 0 && l.t === 0)
        ? L(T.priceOnSite)
        : (tid ? fmt(tid === 'top' ? l.t : l.m) : fmtFrom(l.m));
      html += row(L(l.label), val);
    });
  }
  if(withDate) html += row(L(T.rDate), hasDateStep() ? (dateText() + ', ' + (pickedSlot || '—')) : L(T.willContact));
  return html;
}

function renderResult(){
  const q = quote();
  $('rTitle').textContent = headTitle();
  $('rRows').innerHTML = quoteRows(tier, false);
  $('rWhy').textContent = whyText();

  const need = needsMaster();
  $('masterBlock').hidden = !need;

  if(need){
    const box = $('tiers');
    box.innerHTML = '';
    TIERS.forEach(tr=>{
      const b = document.createElement('button');
      b.type='button';
      b.className = 'tier' + (tier===tr.id ? ' sel':'');
      b.innerHTML =
        '<span class="tier-mark"></span>'+
        '<span class="tier-top"><span class="tier-name"></span>'+(tr.tag?'<span class="tier-tag"></span>':'')+'</span>'+
        '<span class="tier-price"></span><ul class="tier-list"></ul>';
      b.querySelector('.tier-name').textContent = L(tr);
      if(tr.tag) b.querySelector('.tier-tag').textContent = L(tr.tag);
      const sum = tr.id === 'top' ? q.t : q.m;
      b.querySelector('.tier-price').textContent = q.approx ? fmtFrom(sum) : fmt(sum);
      const ul = b.querySelector('.tier-list');
      tr.points.forEach(p=>{ const li=document.createElement('li'); li.textContent=L(p); ul.appendChild(li); });
      b.addEventListener('click', ()=>{
        tier = tr.id;
        box.querySelectorAll('.tier').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        $('toDate').disabled = false;
        $('rRows').innerHTML = quoteRows(tier, false);
      });
      box.appendChild(b);
    });
    $('toDate').disabled = !tier;
  } else {
    tier = tier || 'master';
    $('toDate').disabled = false;
  }

  setCounter('cResult');
  progress(62);
  show('result');
}

$('toDate').addEventListener('click', ()=>{
  if(hasDateStep()) renderDate();
  else { redrawWheel(); setCounter('cWheel'); progress(80); show('wheel'); }
});

/* ========================== КАЛЕНДАРЬ ========================== */
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const SLOT_RESERVE = 90;

function dateText(){
  if(!pickedDate) return '—';
  const d = pickedDate.getDate(), mo = pickedDate.getMonth();
  const wd = (pickedDate.getDay() + 6) % 7;
  return lang==='ru'
    ? d + ' ' + MONTHS_OF.ru[mo] + ', ' + DOW_SHORT.ru[wd]
    : d + '-' + MONTHS_OF.uz[mo] + ', ' + DOW_SHORT.uz[wd];
}

function renderDate(){
  if(!calMonth){ const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  drawMonth();
  setCounter('cDate');
  progress(72);
  show('date');
}
function drawMonth(){
  const today = startOfDay(new Date());
  const last = new Date(today); last.setDate(last.getDate() + CONFIG.daysAhead);

  $('calTitle').textContent = MONTHS[lang][calMonth.getMonth()] + ' ' + calMonth.getFullYear();
  $('calPrev').disabled = calMonth <= new Date(today.getFullYear(), today.getMonth(), 1);
  $('calNext').disabled = calMonth >= new Date(last.getFullYear(), last.getMonth(), 1);

  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const shift = (first.getDay() + 6) % 7;
  const total = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();

  const box = $('calDays');
  box.innerHTML = '';
  for(let i=0;i<shift;i++) box.appendChild(document.createElement('span'));
  for(let d=1; d<=total; d++){
    const date = new Date(calMonth.getFullYear(), calMonth.getMonth(), d);
    const b = document.createElement('button');
    b.type='button'; b.className='day'; b.textContent = d;
    const off = date < today || date > last;
    if(off){ b.classList.add('off'); b.disabled = true; }
    if(+date === +today) b.classList.add('today');
    if(pickedDate && +date === +pickedDate) b.classList.add('sel');
    if(!off) b.addEventListener('click', ()=>{ pickedDate = date; pickedSlot = null; drawMonth(); });
    box.appendChild(b);
  }
  drawSlots();
}
$('calPrev').addEventListener('click', ()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); drawMonth(); });
$('calNext').addEventListener('click', ()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); drawMonth(); });

function localSlots(date){
  const out = [], now = new Date();
  const isToday = +startOfDay(now) === +startOfDay(date);
  const lastStart = CONFIG.closeHour*60 - SLOT_RESERVE;
  for(let mi = CONFIG.openHour*60; mi <= lastStart; mi += CONFIG.slotStep){
    if(isToday && mi < now.getHours()*60 + now.getMinutes() + 60) continue;
    out.push(String(Math.floor(mi/60)).padStart(2,'0')+':'+String(mi%60).padStart(2,'0'));
  }
  return out;
}
async function fetchSlots(date){
  if(!CONFIG.slotsApi) return localSlots(date);
  try{
    const r = await fetch(CONFIG.slotsApi + '?date=' + iso(date) + '&tier=' + encodeURIComponent(tier || 'master'));
    const j = await r.json();
    return Array.isArray(j.slots) ? j.slots : localSlots(date);
  }catch(e){ return localSlots(date); }
}
async function drawSlots(){
  const box = $('slots');
  if(!pickedDate){ $('slotsTitle').textContent = L(T.pickDay); box.innerHTML = ''; return; }
  $('slotsTitle').textContent = L(T.freeTime) + dateText();
  box.innerHTML = '';
  const slots = await fetchSlots(pickedDate);
  if(!slots.length){ $('slotsTitle').textContent = L(T.noSlots); return; }
  slots.forEach(tm=>{
    const b = document.createElement('button');
    b.type='button'; b.className='slot'; b.textContent = tm;
    b.addEventListener('click', ()=>{
      pickedSlot = tm;
      box.querySelectorAll('.slot').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      setTimeout(()=>{ redrawWheel(); setCounter('cWheel'); progress(82); show('wheel'); }, 200);
    });
    box.appendChild(b);
  });
}

/* ========================== КОЛЕСО ========================== */
const SECTORS = [
  {lines:P(['Бесплатный','маникюр'],['Bepul','manikyur']),    win:true},
  {lines:P(['Скидка','20%'],['20%','chegirma']),              win:true},
  {lines:P(['Пусто'],['Boʻsh']),                              win:false},
  {lines:P(['Дизайн','в подарок'],['Dizayn','sovgʻa']),       win:true},
  {lines:P(['Пусто'],['Boʻsh']),                              win:false},
  {lines:P(['Скидка','5%'],['5%','chegirma']),                win:true},
  {lines:P(['Сертификат','200 000'],['Sertifikat','200 000']),win:true},
  {lines:P(['Снятие','в подарок'],['Olib tashlash','sovgʻa']),win:true},
  {lines:P(['Пусто'],['Boʻsh']),                              win:false}
];
const STEP = 360/SECTORS.length;
const FILL = ['#F79BB4','#FBD584','#FFFFFF'];
const TXTC = ['#FFFFFF','#7A5410','#B3A0A6'];

function redrawWheel(){
  const g = $('wheelRot');
  const cx=170, cy=170, r=158;
  let out = '<circle cx="170" cy="170" r="167" fill="#FFE7EE"/>'
          + '<circle cx="170" cy="170" r="161" fill="none" stroke="#F6C0CF" stroke-width="2"/>';
  SECTORS.forEach((s,i)=>{
    const a1=i*STEP, a2=(i+1)*STEP, mid=a1+STEP/2;
    const pt = ang => [cx + r*Math.sin(ang*Math.PI/180), cy - r*Math.cos(ang*Math.PI/180)];
    const [x1,y1]=pt(a1), [x2,y2]=pt(a2);
    out += `<path d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${FILL[i%3]}" stroke="#FFFFFF" stroke-width="1.8"/>`;
    const lines = L(s.lines);
    const flip = mid > 180;
    const rot  = flip ? mid + 90 : mid - 90;
    const tx   = flip ? cx - r*0.585 : cx + r*0.585;
    const size = lines.length > 1 ? 12 : 13;
    const base = lines.length > 1 ? cy - 6 : cy + 4;
    let tsp = '';
    lines.forEach((ln,k)=>{ tsp += `<tspan x="${tx}" y="${base + k*15}">${ln}</tspan>`; });
    out += `<text text-anchor="middle" transform="rotate(${rot} ${cx} ${cy})" font-family="Manrope, sans-serif" font-size="${size}" font-weight="${s.win?'700':'500'}" fill="${TXTC[i%3]}">${tsp}</text>`;
  });
  for(let i=0;i<SECTORS.length;i++){
    const ang = i*STEP*Math.PI/180;
    out += `<circle cx="${(cx + 163*Math.sin(ang)).toFixed(2)}" cy="${(cy - 163*Math.cos(ang)).toFixed(2)}" r="3" fill="#FFFFFF" stroke="#F6B3C6" stroke-width="1.1"/>`;
  }
  g.innerHTML = out;
}

function spinTo(target, ms, turns){
  const wanted = -(target*STEP + STEP/2);
  let next = wanted;
  while(next < rotation + turns*360) next += 360;
  rotation = next;
  const g = $('wheelRot');
  g.style.transition = `transform ${ms}ms cubic-bezier(.16,.68,.16,1)`;
  g.style.transform = `rotate(${rotation}deg)`;
  return new Promise(r=>setTimeout(r, ms + 120));
}

$('spin').addEventListener('click', async ()=>{
  if(spinning) return;
  spinning = true;
  $('spin').disabled = true;
  $('spin').textContent = L(T.spinning);

  if(spinCount === 0){
    await spinTo(4, 4400, 4);
    spinCount = 1;
    openModal({ title:L(T.missTitle), prize:L(T.missPrize), text:L(T.missText), btn:L(T.missBtn),
      onClick:()=>{ closeModal(); $('spin').disabled=false; $('spin').textContent=L(T.spinBtn); spinning=false; } });
  } else {
    await spinTo(1, 5600, 6);
    confetti();
    openModal({ title:L(T.winTitle), prize:L(T.winPrize), text:L(T.winText), btn:L(T.winBtn),
      onClick:()=>{ closeModal(); renderForm(true); } });
  }
});

/* ========================== ФОРМА ========================== */
const totalNow = () => { const q = quote(); return tier === 'top' ? q.t : q.m; };
const finalPrice = () => Math.round(totalNow() * 0.8 / 1000) * 1000;
const tierName = () => L(TIERS.find(x=>x.id===(tier||'master')));

function renderForm(scroll){
  const q = quote();
  let html = quoteRows(tier, true);
  if(!q.unknown) html += row(L(T.rMaster), tierName());

  if(!q.unknown && totalNow() > 0){
    html += row(L(T.rTotal), q.approx ? fmtFrom(totalNow()) : fmt(totalNow()), 'total');
    html += row(L(T.rDiscount), '− ' + fmt(totalNow() - finalPrice()), 'save');
    html += row(L(T.rPay), q.approx ? fmtFrom(finalPrice()) : fmt(finalPrice()), 'total');
  } else {
    html += row(L(T.rWheelOnly), L(T.rFirstVisit), 'total');
  }
  $('fRows').innerHTML = html;

  const noteKey = q.admin === 'two' ? 'byAdmin2' : q.admin === 'three' ? 'byAdmin3' : q.admin === 'help' ? 'byAdminHelp' : null;
  $('fNote').hidden = !noteKey;
  if(noteKey) $('fNote').textContent = L(T[noteKey]);

  setCounter('cForm');
  progress(94);
  show('form');
  if(scroll) requestAnimationFrame(()=>{ $('formCard').scrollIntoView({block:'start', behavior:'smooth'}); });
}

/* телефон: +998 закреплён */
$('fPhone').addEventListener('input', e=>{
  let raw = e.target.value.replace(/\D/g,'');
  if(raw.length > 9 && raw.startsWith('998')) raw = raw.slice(3);
  const d = raw.slice(0,9);
  let out = d.slice(0,2);
  if(d.length > 2) out += ' ' + d.slice(2,5);
  if(d.length > 5) out += ' ' + d.slice(5,7);
  if(d.length > 7) out += ' ' + d.slice(7,9);
  e.target.value = out;
});
$('fPhone').addEventListener('keydown', e=>{ if(e.key === 'Enter') $('send').click(); });

$('send').addEventListener('click', ()=>{
  const name = $('fName').value.trim();
  const digits = $('fPhone').value.replace(/\D/g,'');
  const phone = '+998 ' + $('fPhone').value.trim();
  const tg = $('fTg').value.trim();
  if(name.length < 2 || digits.length !== 9){ $('fErr').classList.add('is-on'); return; }
  $('fErr').classList.remove('is-on');

  const q = quote();
  const code = 'ZM20-' + Math.floor(1000 + Math.random()*9000);
  lastLead = {
    code, name, phone, telegram: tg,
    services: (q.unknown && q.admin !== 'help') ? [customList()] : q.lines.map(l=>l.label.ru),
    master: q.unknown ? '' : TIERS.find(x=>x.id===(tier||'master')).ru,
    total: q.unknown ? 0 : totalNow(),
    totalWithDiscount: q.unknown ? 0 : finalPrice(),
    needsAdmin: q.admin || '',
    date: (pickedDate && hasDateStep()) ? iso(pickedDate) : '',
    slot: hasDateStep() ? (pickedSlot || '') : '',
    lang, createdAt: new Date().toISOString()
  };

  /* Za_manic analitika: leadni serverga yuborish (javob kutilmaydi) */
  try{ ZMTracker.submit({ name: name, phone: phone, service: lastLead.services.join(', '), master: lastLead.master, desired_time: ((lastLead.date || '') + ' ' + (lastLead.slot || '')).trim(), client_code: lastLead.code || '', note: [lastLead.total ? ('Итого ' + lastLead.total + (lastLead.totalWithDiscount ? ', со скидкой ' + lastLead.totalWithDiscount : '')) : '', lastLead.telegram ? ('TG: ' + lastLead.telegram) : '', lastLead.needsAdmin ? ('админ: ' + lastLead.needsAdmin) : ''].filter(Boolean).join(' · ') }); }catch(e){}
  try{
    const all = JSON.parse(localStorage.getItem('zm_leads') || '[]');
    all.push(lastLead); localStorage.setItem('zm_leads', JSON.stringify(all));
  }catch(e){}
  if(CONFIG.leadWebhook){
    try{ fetch(CONFIG.leadWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lastLead)}).catch(()=>{}); }catch(e){}
  }

  track('Lead', { content_name: lastLead.services.join(', '), value: lastLead.totalWithDiscount, currency:'UZS' }, true);

  renderDone();
  setCounter('cDone');
  progress(100);
  show('done');
});

function renderDone(){
  if(!lastLead) return;
  const q = quote();
  $('doneTitle').textContent = (lang==='ru' ? 'Готово, ' : 'Tayyor, ') + lastLead.name;
  $('dCode').textContent = lastLead.code;

  let html = quoteRows(tier, true);
  if(!q.unknown){
    html += row(L(T.rMaster), tierName());
    if(totalNow() > 0){
      html += row(L(T.rTotal), q.approx ? fmtFrom(totalNow()) : fmt(totalNow()), 'total');
      html += row(L(T.rPayDisc), q.approx ? fmtFrom(finalPrice()) : fmt(finalPrice()), 'total');
    }
  }
  $('dRows').innerHTML = html;

  $('dBook').href = CONFIG.instagram;
  const svc = (q.unknown && q.admin !== 'help') ? customList() : q.lines.map(l=>L(l.label)).join(', ');
  const when = hasDateStep() ? (dateText() + ', ' + (pickedSlot||'')) : L(T.willContact);
  const money = (!q.unknown && totalNow() > 0)
    ? (lang==='ru' ? `Итого: ${fmt(totalNow())}, со скидкой ${fmt(finalPrice())}\n`
                   : `Jami: ${fmt(totalNow())}, chegirma bilan ${fmt(finalPrice())}\n`)
    : '';
  const msg = lang==='ru'
    ? `Здравствуйте! Я прошла квиз на сайте.\nИмя: ${lastLead.name}\nТелефон: ${lastLead.phone}\n` +
      `Услуги: ${svc}\n` + (q.unknown ? '' : `Мастер: ${tierName()}\n`) +
      `Когда: ${when}\n` + money + `Промокод: ${lastLead.code}`
    : `Assalomu alaykum! Saytdagi testdan oʻtdim.\nIsm: ${lastLead.name}\nTelefon: ${lastLead.phone}\n` +
      `Xizmatlar: ${svc}\n` + (q.unknown ? '' : `Usta: ${tierName()}\n`) +
      `Qachon: ${when}\n` + money + `Promokod: ${lastLead.code}`;
  $('dTg').href = CONFIG.telegram + '?text=' + encodeURIComponent(msg);
}

$('dBook').addEventListener('click', ()=>{ track('InstagramClick', { content_name:'Инстаграм профиль', source:'quiz_final' }); });

/* ========================== МОДАЛКА ========================== */
let modalHandler = null;
function openModal({title,prize,text,btn,onClick}){
  $('mTitle').textContent = title;
  $('mPrize').textContent = prize;
  $('mText').textContent = text;
  $('mBtn').textContent = btn;
  if(modalHandler) $('mBtn').removeEventListener('click', modalHandler);
  modalHandler = onClick;
  $('mBtn').addEventListener('click', modalHandler);
  $('modal').classList.add('is-on');
}
const closeModal = () => $('modal').classList.remove('is-on');

function confetti(){
  const wrap = document.createElement('div');
  wrap.className = 'conf';
  const colors = ['#FBD584','#F79BB4','#FFE7EE','#A8DCCB','#FFFFFF'];
  for(let i=0;i<70;i++){
    const s = document.createElement('i');
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = '-14px';
    s.style.background = colors[i%colors.length];
    s.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    s.style.animationDelay = (Math.random()*0.5) + 's';
    wrap.appendChild(s);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 4200);
}
